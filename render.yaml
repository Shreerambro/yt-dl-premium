services:
  - type: worker
    name: yt-dl-bot
    runtime: python
    buildCommand: |
      pip install -r requirements.txt
      curl -fsSL https://deno.land/install.sh | sh
    startCommand: |
      export DENO_DIR="$HOME/.deno"
      export PATH="$DENO_DIR/bin:$PATH"
      python bot.py
    envVars:
      - key: API_ID
        sync: false
      - key: API_HASH
        sync: false
      - key: BOT_TOKEN
        sync: false
      - key: AUTH_USERS
        sync: false
        value: ""
